name: Publish player guide

on:
  push:
    branches: [main]
    paths:
      - "Docs/Player-Guide/site/**"
      - ".github/workflows/player-guide-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-guide-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload guide
        uses: actions/upload-pages-artifact@v4
        with:
          path: Docs/Player-Guide/site
      - name: Deploy guide
        id: deployment
        uses: actions/deploy-pages@v4
